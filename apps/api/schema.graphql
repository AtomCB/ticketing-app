"""
The API contract. Both apps generate TypeScript types from this file (`pnpm codegen`).
"""

scalar DateTime

type Query {
  health: Health!
  event(id: ID!): Event
  events(limit: Int! = 10): [Event!]!
}

type Health {
  postgres: Boolean!
  redis: Boolean!
}

type Venue {
  id: ID!
  name: String!
  city: String!
}

enum EventStatus {
  SCHEDULED
  ON_SALE
  SOLD_OUT
  CANCELLED
}

type Event {
  id: ID!
  name: String!
  description: String!
  startsAt: DateTime!
  status: EventStatus!
  venue: Venue!
  # availability: Availability!
  seats: [EventSeat!]!
}

# type Availability {

# }

enum SeatStatus {
  AVAILABLE
  HELD
  SOLD
}

type EventSeat {
  id: ID!
  section: String!
  row: String!
  number: Int!
  priceCents: Int!
  status: SeatStatus!
}

