"""
The API contract. Both apps generate TypeScript types from this file (`pnpm codegen`).
"""

scalar DateTime

type Query {
  health: Health!
  event(id: ID!): Event
  """
  Events in start order, a page at a time. Pass the previous page's
  pageInfo.endCursor as `after` to get the next page. `city` filters before paging.
  """
  events(first: Int! = 10, after: String, city: String): EventConnection!
  "Every city with a venue, sorted. Feeds the city filter."
  cities: [String!]!
  me: User
}

type Mutation {
  "Creates an account and signs it in."
  signUp(email: String!, password: String!): User!
  "Signs in. Fails with the same error for an unknown email or a wrong password."
  signIn(email: String!, password: String!): User!
  "Ends the current session. Returns true even if there was no session."
  signOut: Boolean!
  """
  Holds seats for the signed-in user for 10 minutes, all or nothing (up to 8, one hold
  per event). If any seat was already taken, nothing is held and the result is
  SeatsUnavailable, listing those seats.
  """
  holdSeats(eventId: ID!, seatIds: [ID!]!): HoldSeatsResult!
}

type Health {
  postgres: Boolean!
  redis: Boolean!
}

type Venue {
  id: ID!
  name: String!
  city: String!
}

enum EventStatus {
  SCHEDULED
  ON_SALE
  SOLD_OUT
  CANCELLED
}

type Event {
  id: ID!
  name: String!
  description: String!
  startsAt: DateTime!
  status: EventStatus!
  venue: Venue!
  availability: Availability!
  seats: [EventSeat!]!
}

type Availability {
  available: Int!
  total: Int!
  held: Int!
  sold: Int!
  minPriceCents: Int
}

enum SeatStatus {
  AVAILABLE
  HELD
  SOLD
}

type EventSeat {
  id: ID!
  section: String!
  row: String!
  number: Int!
  priceCents: Int!
  status: SeatStatus!
}

"""
One page of events (a Relay-style connection). Always returned, even when nothing
matches: then `edges` is empty and `hasNextPage` is false.
"""
type EventConnection {
  edges: [EventEdge!]!
  pageInfo: PageInfo!
}

"One event in a page, plus its position in the list."
type EventEdge {
  "Opaque. Pass it as `after` to get the events that come after this one."
  cursor: String!
  node: Event!
}

type PageInfo {
  hasNextPage: Boolean!
  "The last edge's cursor, or null when the page is empty."
  endCursor: String
}

type User {
  id: ID!
  email: String!
}

"Seats kept for one person while they check out. They go back on sale at expiresAt."
type Hold {
  id: ID!
  expiresAt: DateTime!
  seats: [EventSeat!]!
}

"Why a hold didn't happen: these seats were already sold or held by someone else."
type SeatsUnavailable {
  seats: [EventSeat!]!
}

"""
What holdSeats returns. Losing a seat to someone faster is an expected outcome, not an
error, so it's a result the client must handle (check __typename).
"""
union HoldSeatsResult = Hold | SeatsUnavailable

