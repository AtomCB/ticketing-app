"""
The API contract. Both apps generate TypeScript types from this file (`pnpm codegen`).
"""

scalar DateTime

type Query {
  health: Health!
  event(id: ID!): Event
  """
  Events in start order, a page at a time. Pass the previous page's
  pageInfo.endCursor as `after` to get the next page. `city` filters before paging.
  """
  events(first: Int! = 10, after: String, city: String): EventConnection!
  "Every city with a venue, sorted. Feeds the city filter."
  cities: [String!]!
}

type Health {
  postgres: Boolean!
  redis: Boolean!
}

type Venue {
  id: ID!
  name: String!
  city: String!
}

enum EventStatus {
  SCHEDULED
  ON_SALE
  SOLD_OUT
  CANCELLED
}

type Event {
  id: ID!
  name: String!
  description: String!
  startsAt: DateTime!
  status: EventStatus!
  venue: Venue!
  # availability: Availability!
  seats: [EventSeat!]!
}

# type Availability {

# }

enum SeatStatus {
  AVAILABLE
  HELD
  SOLD
}

type EventSeat {
  id: ID!
  section: String!
  row: String!
  number: Int!
  priceCents: Int!
  status: SeatStatus!
}

"""
One page of events (a Relay-style connection). Always returned, even when nothing
matches: then `edges` is empty and `hasNextPage` is false.
"""
type EventConnection {
  edges: [EventEdge!]!
  pageInfo: PageInfo!
}

"One event in a page, plus its position in the list."
type EventEdge {
  "Opaque. Pass it as `after` to get the events that come after this one."
  cursor: String!
  node: Event!
}

type PageInfo {
  hasNextPage: Boolean!
  "The last edge's cursor, or null when the page is empty."
  endCursor: String
}
